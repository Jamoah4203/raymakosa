<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Complete Payment</h2>
        <p>Amount: GHS {{ transaction.amount }}</p>
        <button id="payBtn" class="btn btn-success">Simulate Payment</button>

        <div id="confirmationMessage" class="mt-3" style="display: none;">
            <p class="alert alert-success">Payment received! Your transaction is being processed.</p>
        </div>
    </div>

    <script>
        document.getElementById("payBtn").addEventListener("click", function() {
            fetch("{% url 'confirm_payment' transaction.id %}", { 
                method: "POST", 
                headers: { "X-CSRFToken": "{{ csrf_token }}" } 
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                document.getElementById("confirmationMessage").style.display = "block";
            });
        });
    </script>
</body>
</html>
