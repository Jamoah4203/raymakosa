<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Makosa - Buy Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: url('BG.jpg') no-repeat center center fixed; background-size: cover;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mx-auto ">
        <div class="container">
            <a class="navbar-brand" href="#">Ray Makosa - Data Packages</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center">Welcome to Ray Makosa</h1>
        <p class="text-center">Your trusted partner for fast and reliable data bundles.</p>

        <hr>

        <h3>Buy Data Package</h3>
        <form method="post" action="{% url 'buy_data' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="phone_number" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone_number" name="phone_number" required>
            </div>

            <div class="mb-3">
                <label for="network" class="form-label">Select Network</label>
                <select class="form-control" id="network" name="network" required>
                    {% for network in networks %}
                    <option value="{{ network.id }}">{{ network.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="data_package" class="form-label">Select Data Package</label>
                <select class="form-control" id="data_package" name="data_package" required>
                    {% for package in packages %}
                    <option value="{{ package.id }}">{{ package.package_name }} - GHS {{ package.price }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Proceed to Payment</button>
        </form>
    </div>
</body>
</html>
